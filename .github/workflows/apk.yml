name: APK bauen
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor einrichten
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable.png www/
          cat > capacitor.config.json <<'EOF'
          {"appId":"de.henry.ergebnisse","appName":"HenryMagicLive","webDir":"www","backgroundColor":"#0a1730","plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF
          npx cap add android
          npx cap sync android
      - name: Icon und Farben setzen
        run: |
          R=android/app/src/main/res
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          IM=convert; command -v magick >/dev/null 2>&1 && IM=magick
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            $IM icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            $IM icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher_round.png
            $IM icon-maskable.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0A1730</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Henrys-Ergebnisse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
