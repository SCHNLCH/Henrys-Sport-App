name: APK bauen
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor einrichten
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable.png www/
          cat > capacitor.config.json <<'EOF'
          {"appId":"de.henry.ergebnisse","appName":"HenryMagicLive","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF
          npx cap add android
          npx cap sync android
      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Henrys-Ergebnisse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
